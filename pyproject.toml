[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pile"
version = "0.1.0"
description = "Reads a pile of supplier paperwork and reports the status of the paperwork and the goods"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=3.17",
    "pypdfium2>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "lxml>=5.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4.0"]
ocr = ["pytesseract>=0.3"]
gemini = ["google-genai>=1.0"]

[project.scripts]
pile = "pile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
